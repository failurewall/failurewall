name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches: [main]
    tags: ["*"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: temurin
    - uses: sbt/setup-sbt@v1
    - uses: coursier/cache-action@v8
    - run: sbt -v "+ test"
